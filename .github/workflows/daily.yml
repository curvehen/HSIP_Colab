name: HSI Daily Prediction Pipeline

on:
  schedule:
    - cron: '45 8 * * 1-5'   # 16:45 HKT, Mon-Fri (UTC 08:45)
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write   # 允許 workflow 使用 GITHUB_TOKEN 寫入/push repo 內容

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -m src.daily_pipeline

      - name: Generate charts
        run: python -m src.charts

      - name: Send email report
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASS: ${{ secrets.EMAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.EMAIL_RECEIVER }}
        run: python -m src.send_report

      - name: Commit and push state/models/results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ models/ results/
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
